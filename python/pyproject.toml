[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "idcator"
version = "1.0.0"
description = "IDCator order-flow tools (Imbalance Levels, HVN Profile, Heavy Absorption, Pressure Toolkit) for analysis"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
chart = ["matplotlib>=3.7"]
test = ["pytest>=7", "matplotlib>=3.7"]

[project.scripts]
idcator = "idcator.__main__:main"

[tool.setuptools]
packages = ["idcator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
